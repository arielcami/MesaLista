<!-- PopupCustom2Options.html -->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="popupCustom2Options">
	<div id="popup-custom-modal" class="ppp-modal2opt-overlay hidden">
		<div class="ppp-modal2opt-content">
			<div class="ppp-modal2opt-icon" id="popup-icon"></div>
			<div class="ppp-modal2opt-message" id="popup-message">Mensaje por defecto</div>
			<div class="ppp-modal2opt-buttons">
				<button id="popup-confirm-btn" class="ppp-modal2opt-btn ppp-modal2opt-confirm">OK</button>
				<button id="popup-cancel-btn" class="ppp-modal2opt-btn ppp-modal2opt-cancel">Cancelar</button>
			</div>
		</div>
	</div>
</div>
